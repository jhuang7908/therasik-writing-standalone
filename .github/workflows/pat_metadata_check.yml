name: PAT Metadata Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GH_PAT safely
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_PAT:-}" ]]; then
            echo "GH_PAT=MISSING"
            exit 1
          fi

          hdr=$(mktemp)
          code=$(curl -sS -D "$hdr" -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)
          echo "user_api_http=$code"
          tr -d '\r' < "$hdr" | grep -Ei '^(github-authentication-token-expiration|x-oauth-scopes|x-accepted-oauth-scopes):' || true

          repo_code=$(curl -sS -o /tmp/repo.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jhuang7908/insynbio-website)
          echo "insynbio_repo_http=$repo_code"
          python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/repo.json', encoding='utf-8'))
              print("insynbio_permissions=", d.get("permissions"))
          except Exception as e:
              print("insynbio_permissions_parse_error=", type(e).__name__)
          PY
